services:
  postgres:
    image: postgres:16
    container_name: defensoria_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: defensoria_admin
      POSTGRES_PASSWORD: defensoria_dev_password
      POSTGRES_DB: defensoria_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGCLIENTENCODING: UTF8
      LC_ALL: C.UTF-8
    ports:
      - "5435:5432"
    volumes:
      - defensoria_pgdata_dev:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: defensoria_minio_dev
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - defensoria_miniodata_dev:/data

volumes:
  defensoria_pgdata_dev:
  defensoria_miniodata_dev:
