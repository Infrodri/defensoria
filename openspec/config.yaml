# openspec/config.yaml — SDD configuration for defensoria (hybrid mode: engram + openspec)
# Generated by sdd-init refresh on 2026-08-04.

schema: spec-driven

context: |
  Monorepo "defensoria-nna" (Sistema de Gestión de Casos NNA) — Turborepo 2.4 + npm workspaces (npm@10.8.2).
  apps/web: Next.js 16 (App Router, React 19, Tailwind CSS v4 CSS-first, shadcn/ui, RHF+zod, tanstack-table) on port 3100.
  apps/api: NestJS 11 (feature modules per domain, RBAC guards, Audit/RLS interceptors, Swagger) on port 4100.
  packages/db: Prisma 6 + PostgreSQL (host port 5435); packages/shared: shared Zod schemas/enums (string enums).
  UI copy and routes in Spanish (kebab-case); code/identifiers in English. Conventional Commits. PKs UUID v7.
  Security: NNA data must never go to external AI providers without written legal authorization; audit_log is append-only; no delete actions.
  Full conventions source: .agents/AGENTS.md.

strict_tdd: true

testing:
  runner: vitest
  runner_command: npm run test
  unit_command: npm run test --workspace @defensoria/api
  e2e_command: npm run test:e2e --workspace @defensoria/web
  type_check: npx tsc --noEmit (apps/api, packages/shared); npx tsc --noEmit --skipLibCheck (apps/web)
  coverage: none configured
  notes: |
    Unit: Vitest 4.0 (apps/api, node env, globals: true, src/**/*.spec.ts — 10 spec files).
    E2E: Playwright 1.49 (apps/web, chromium+firefox, baseURL localhost:3100, 2 spec files).
    Web app has NO unit test framework. Linter scripts declared (eslint / next lint) but no config or deps detected.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect NNA data governance: no external AI providers without written legal authorization
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - UI-facing copy in Spanish; code identifiers in English
  design:
    - Follow NestJS feature-module pattern; reuse existing guards and interceptors
    - Follow shadcn/ui + zod patterns in apps/web
    - Include sequence diagrams for complex flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Follow .agents/AGENTS.md conventions (naming, ports, security)
    tdd: true
    test_command: npm run test --workspace @defensoria/api
  verify:
    test_command: npm run test
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
